[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "igor-pro-mcp"
version = "0.4.0"
description = "Windows Igor Pro MCP server with native JSON-RPC pipe transport, COM fallback, and bundled Markdown knowledge"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gabor Szabo" }]
requires-python = ">=3.10"
dependencies = ["mcp>=1.28,<2", "pywin32>=308; sys_platform == 'win32'"]
keywords = ["igor-pro", "wavemetrics", "mcp", "model-context-protocol", "scientific-computing", "windows"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/gabzsi/igormcp"
Repository = "https://github.com/gabzsi/igormcp"
Issues = "https://github.com/gabzsi/igormcp/issues"

[project.scripts]
igor-pro-mcp = "igor_mcp_server:main"
igor-mcp-server = "igor_mcp_server:main"

[tool.setuptools]
py-modules = ["igor_mcp_server", "igor_pipe", "igor_knowledge", "igor_sessions", "igor_reports", "igor_report_links"]
packages = ["knowledge", "native"]

[tool.setuptools.package-data]
knowledge = ["**/*.md", "**/*.png", "*.json"]
native = ["*.cs", "*.ipf"]
